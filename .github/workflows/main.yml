name: Compiler SERVICE PACHA PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire et Compiler sans gradlew
        run: |
          ls -la
          rm -rf projet
          unzip -o service-pacha-pro-android.zip -d projet
          echo "--- CONTENU RACINE DU PROJET ---"
          ls -la projet
          # Chercher le dossier qui contient settings.gradle
          ROOT=$(find projet -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            ROOT=$(find projet -name "build.gradle*" | head -n 1 | xargs dirname)
            ROOT=$(dirname "$ROOT")
          fi
          echo "Dossier racine trouve: $ROOT"
          cd "$ROOT"
          pwd
          ls -la
          gradle assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: SERVICE-PACHA-PRO-APK
          path: "**/build/outputs/apk/debug/*.apk"
