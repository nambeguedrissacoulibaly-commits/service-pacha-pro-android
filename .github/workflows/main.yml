name: Compiler SERVICE PACHA PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire et Compiler avec le bon Gradle
        run: |
          rm -rf projet
          unzip -o service-pacha-pro-android.zip -d projet
          ROOT=$(find projet -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "Racine: $ROOT"
          cd "$ROOT"
          ls -la
          chmod +x gradlew
          bash ./gradlew assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: SERVICE-PACHA-PRO-APK
          path: "**/build/outputs/apk/debug/*.apk"
