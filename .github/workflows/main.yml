name: Compiler SERVICE PACHA PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire le projet Android
        run: |
          unzip -q service-pacha-pro-android.zip -d projet
          find projet -name gradlew -type f

      - name: Compiler l'application
        run: |
          GRADLEW=$(find projet -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: SERVICE-PACHA-PRO-APK
          path: projet/**/app/build/outputs/apk/debug/*.apk
